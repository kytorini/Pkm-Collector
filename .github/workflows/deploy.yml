# Builds the app and publishes it to GitHub Pages.
#
# One-time setup, in the browser: Settings -> Pages -> Source: "GitHub Actions".
# The workflow cannot do this itself — creating a Pages site needs repository
# admin rights, which GITHUB_TOKEN does not carry even with `pages: write`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/pokemon-card-tracker-irbbd5, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Pages serves this repo at /Pkm-Collector/, not at the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
